name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy scipy scikit-learn matplotlib ruff
      - run: ruff check --select E9,F prefixgate app scripts test_prefixgate.py
      - run: python3 -m prefixgate.ltt
      - run: python3 test_prefixgate.py
      - run: python3 -m prefixgate.run
